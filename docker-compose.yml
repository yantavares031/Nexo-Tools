services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-tools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-nexo_tools}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    ports:
      - "127.0.0.1:4420:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yantavares021/nexo-tools:latest
    container_name: nexo-tools-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACTIVE_DRIVER_DB: POSTGRE
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nexo_tools}
    ports:
      - "127.0.0.1:4421:3000"
    volumes:
      - app_logs:/app/logs
    depends_on:
      - postgres

  # PM2 só aqui (cron); o Next no serviço `app` não usa PM2 — evita ENOTDIR com ecosystem.config.cjs
  backup:
    image: yantavares021/nexo-tools:latest
    container_name: nexo-tools-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACTIVE_DRIVER_DB: POSTGRE
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nexo_tools}
    command: ["pm2-runtime", "start", "ecosystem.backup-only.cjs"]
    volumes:
      - app_logs:/app/logs
    depends_on:
      - postgres

volumes:
  postgres_data:
  app_logs:
